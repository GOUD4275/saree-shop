<!DOCTYPE html>
<html>
<head>
  <title>Cart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🛒 మీ కార్ట్</h1>

<div id="cart-items"></div>

<h2 id="total"></h2>

<button onclick="clearCart()">🗑️ Clear Cart</button>

<!-- 🔥 PAYMENT SECTION -->
<div class="payment-box">
  <h3>💳 Payment Method</h3>

  <label>
    <input type="radio" name="payment" value="cod" checked>
    <span>💵 Cash on Delivery</span>
  </label>

  <label>
    <input type="radio" name="payment" value="upi">
    <span>💳 Pay with UPI (PhonePe / GPay)</span>
  </label>

  <p>💡 UPI ID: <b>gowd20092@ybl</b></p>
</div>

<button onclick="checkout()">📦 Place Order</button>

<hr>

<h2>📋 Customer Details</h2>

<input type="text" id="name" placeholder="మీ పేరు"><br><br>
<input type="text" id="phone" placeholder="ఫోన్ నెంబర్"><br><br>
<input type="text" id="address" placeholder="అడ్రస్"><br><br>

<script src="cart.js"></script>

</body>
</html>
