<!DOCTYPE html>
<html>
<head>
  <title>Cart</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>🛒 మీ కార్ట్</h1>

  <!-- CART ITEMS -->
  <div id="cart-items" class="card"></div>

  <!-- TOTAL -->
  <h2 id="total" class="total-box"></h2>

  <button onclick="clearCart()" class="danger-btn">🗑️ Clear Cart</button>

  <!-- PAYMENT -->
  <div class="card">
    <h3>💳 Payment Method</h3>

    <label class="payment-option">
      <input type="radio" name="payment" value="cod" checked>
      <span>💵 Cash on Delivery</span>
    </label>
  </div>

  <!-- UPI SECTION -->
  <div class="card upi-box">
    <h3>💳 Pay via UPI</h3>

    <p>Google Pay / PhonePe / Paytm ద్వారా చెల్లించండి</p>

    <a class="upi-btn"
       href="upi://pay?pa=gowd2009@ybl&pn=Fresh%20Cut%20Fruits&cu=INR">
       Pay Now
    </a>

    <p class="note">
      Payment చేసిన తర్వాత screenshot WhatsApp లో పంపండి
    </p>

    <p class="small-text">
      💻 Desktop లో పని చేయకపోవచ్చు → Mobile లో open చేయండి
    </p>

    <img src="upi-qr.png" alt="UPI QR" class="qr-img">
  </div>

  <!-- CUSTOMER DETAILS -->
  <div class="card">
    <h3>📋 Customer Details</h3>

    <input type="text" id="name" placeholder="మీ పేరు">
    <input type="text" id="phone" placeholder="ఫోన్ నెంబర్">
    <input type="text" id="address" placeholder="అడ్రస్">

    <button onclick="checkout()" class="main-btn">📦 Place Order</button>
  </div>

</div>

<script src="cart.js"></script>

</body>
</html>
